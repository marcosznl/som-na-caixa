services:
  - type: web
    name: som-na-caixa
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Pedida na criação do serviço; fica só no Render, fora do repositório.
      - key: YOUTUBE_API_KEY
        sync: false
